name: Keep Streamlit Alive

on:
  schedule:
    # 每 10 分钟访问一次（GitHub 最小间隔是 5 分钟，但为了稳定用 10 分钟）
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit app..."
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://stock-t-terminal-m7wfzeftug4zjgrudafgaa.streamlit.app"
