name: A股做T信号定时巡检

# 说明：GitHub Actions 的 cron 使用 UTC 时间。
# 北京时间 9:25-15:05 对应 UTC 1:25-7:05（周一至周五），
# 所以这里覆盖 UTC 1:00-7:55（即北京 9:00-15:55），
# 脚本内部还会按北京时间精确校验交易时段，非交易时段会自动跳过。
on:
  schedule:
    - cron: "*/5 1-7 * * 1-5"
  workflow_dispatch:  # 允许在 Actions 页面手动点「Run workflow」立即测试
    inputs:
      force:
        description: "非交易时段也强制执行（仅用于测试链路是否正常）"
        required: false
        default: false
        type: boolean

# 需要写权限：把波段记忆的状态变化提交回仓库，让网页端下次打开就能看到
permissions:
  contents: write

# 串行化，避免两次巡检同时提交 band_watch.json 产生冲突
concurrency:
  group: watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests pandas numpy

      - name: 计算今日缓存键（北京日期）
        id: ckey
        run: echo "key=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 恢复去重记录（跨运行保留，避免同一信号重复推送）
        uses: actions/cache/restore@v4
        with:
          path: notify_log.json
          key: notify-log-${{ steps.ckey.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            notify-log-

      - name: 执行巡检推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          # 可选：额外的波段监控名单（不依赖网页端「波段记忆」，逗号分隔 6 位代码）
          BAND_WATCHLIST: ${{ secrets.BAND_WATCHLIST }}
          ALERT_WINDOW_MIN: "10"
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python watcher.py

      - name: 保证去重记录存在
        if: always()
        run: |
          if [ ! -f notify_log.json ]; then echo '{}' > notify_log.json; fi
          echo "---- 当前去重记录 ----"
          cat notify_log.json

      - name: 保存去重记录
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notify_log.json
          key: notify-log-${{ steps.ckey.outputs.key }}-${{ github.run_id }}

      - name: 回写波段状态（有变化时）
        if: always()
        run: |
          echo "---- 当前波段摘要 ----"
          if [ -f band_watch.json ]; then cat band_watch.json; else echo "(文件不存在)"; fi
          # ⚠️ 不能用 `git diff --quiet` 判断：对「未跟踪的新文件」它也返回无变化，
          #    首次创建时会被跳过。git status --porcelain 对新增(??)与修改(M)都会输出。
          if [ -f band_watch.json ] && [ -n "$(git status --porcelain -- band_watch.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add band_watch.json
            git commit -m "chore: 巡检回写波段状态 [skip ci]"
            # 并发场景下远端可能刚更新过，先 rebase 再推，最多重试 3 次
            for i in 1 2 3; do
              if git push; then echo "✅ 波段状态已提交回仓库"; exit 0; fi
              echo "推送失败，拉取远端后重试（第 $i 次）..."; git pull --rebase --autostash || true
            done
            echo "⚠️ 波段状态提交失败（已达最大重试次数），下次巡检会继续尝试"
          else
            echo "band_watch.json 无变化，跳过提交"
          fi
