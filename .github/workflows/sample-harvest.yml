name: 全市场样本自动采集（逻辑验证语料）

# 这个 workflow 的定位：让「样本语料」在**没人打开网页、也没开电脑**的情况下继续长。
# 采集口径与网页端「🧪 逻辑有效性验证 → 采集今日全市场样本」完全同一份代码
# （都走 sample_harvest.py → AST 抽取 ai_stock_terminal.py 里的真实函数），
# 所以云端采的样本和你本机采的样本逐字段同构。
#
# ★ 语料怎么回到网页（2026-09-19 改造）：
#   原来采完只落在 actions/cache 和 Artifact 里 —— 网页端读的是本地文件，
#   于是**云端页面上这个面板永远是空的**，只能靠你在本机手点，这就是「每天都要点一下」的根因。
#   现在改成：采完 → 导出**只含前瞻(forward)样本**的加密快照 → 发布成一个滚动 release 资源
#   （tag = data-latest），网页端每次打开页面自动拉这一份并解密。
#   为什么走 release 而不是提交进仓库：语料是数 MB 的二进制，天天提交会把 git 历史撑爆
#   （release 资源不进 git 历史）；为什么只导 forward：backfill 自带前视/生存者偏差、
#   只能提假设，而 forward 才是能当成绩用的那一类，也是网页统计真正需要的。
#   本机要拿云端采的全量语料（含 backfill）：下载 Artifact 后
#     python sample_harvest.py --pull band_samples.enc

on:
  workflow_dispatch:            # 允许在 Actions 页面手动点「Run workflow」
    inputs:
      mode:
        description: "forward=只采今天 / backfill=历史回填 / merge=合并分片 / stats=看报表"
        required: false
        default: forward
        type: choice
        options: [forward, backfill, merge, stats]
      lookback:
        description: "仅 backfill 用：回看多少个交易日"
        required: false
        default: "450"
        type: string
      limit:
        description: "冒烟测试用：只处理前 N 只（留空=全市场，正式采集必须留空）"
        required: false
        default: ""
        type: string
  schedule:
    # 北京 15:40 = UTC 07:40，收盘后半小时（周一至周五）
    # 未配置 BAND_KEY 时这一步会自动跳过（不会报红），配好即自动开始积累。
    - cron: "40 7 * * 1-5"

# ★ contents: write 只为了发布 data-latest 这个 release 资源。
#   语料本身全程是**加密**的（BAND_KEY，fail-closed：没密钥就拒绝落盘为明文），
#   并且**不进 git 历史**，所以公开仓库里不会出现策略特征表的明文。
permissions:
  contents: write

# 串行化，避免两次运行同时写同一份缓存
concurrency:
  group: sample-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests pandas numpy cryptography

      - name: 计算缓存键（北京日期）
        id: ckey
        run: echo "key=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 恢复语料缓存（承接上一次采集的结果）
        uses: actions/cache/restore@v4
        with:
          path: band_samples.enc
          key: band-samples-${{ steps.ckey.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            band-samples-

      - name: 采集今日全市场样本
        env:
          BAND_KEY: ${{ secrets.BAND_KEY }}
          # 采集口径：全市场、不限板块、不限数量（给机器验证逻辑用，不给你看的那份名单）
        run: |
          if [ -z "$BAND_KEY" ]; then
            echo "::warning::未配置 BAND_KEY：已跳过本次采集。语料里含完整策略特征与收益率，"
            echo "::warning::绝不允许以明文落进 public 仓库的缓存 —— 所以这里 fail-closed 而不是退回明文。"
            echo "::warning::配置路径：本仓库 Settings → Secrets and variables → Actions → New secret，"
            echo "::warning::名称 BAND_KEY，值与 Streamlit Secrets 里的 BAND_KEY 完全一致。"
            exit 0
          fi
          MODE="${{ github.event.inputs.mode || 'forward' }}"
          LOOKBACK="${{ github.event.inputs.lookback || '450' }}"
          # 冒烟测试用：留空则全市场（正式采集都是留空）
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          echo "===== 模式：$MODE ｜ 回看：$LOOKBACK ｜ 限量：${LIMIT_ARG:-全市场} ====="
          if [ "$MODE" = "forward" ]; then
            python sample_harvest.py --forward --store enc --file band_samples.enc $LIMIT_ARG
          elif [ "$MODE" = "backfill" ]; then
            python sample_harvest.py --backfill "$LOOKBACK" --store enc --file band_samples.enc $LIMIT_ARG
          elif [ "$MODE" = "merge" ]; then
            python sample_harvest.py --merge --store enc --file band_samples.enc
          else
            python sample_harvest.py --stats --store enc --file band_samples.enc
          fi

      - name: 确认产物存在
        if: always()
        run: |
          if [ -f band_samples.enc ]; then
            echo "---- 加密语料 ----"
            ls -la band_samples.enc
          else
            echo "(没有 band_samples.enc：首次运行或本次跳过时属正常)"
          fi

      - name: 保存语料缓存（供下一次运行承接）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: band_samples.enc
          key: band-samples-${{ steps.ckey.outputs.key }}-${{ github.run_id }}

      - name: 导出前瞻语料快照（只含 forward，网页端读的就是它）
        if: always()
        env:
          BAND_KEY: ${{ secrets.BAND_KEY }}
        run: |
          if [ -z "$BAND_KEY" ]; then
            echo "::warning::未配 BAND_KEY，跳过导出。"
            exit 0
          fi
          if [ ! -f band_samples.enc ]; then
            echo "(缓存里没有语料，跳过导出)"
            exit 0
          fi
          python sample_harvest.py --export-forward band_samples_forward.enc \
            --store enc --file band_samples.enc

      - name: 发布快照到 data-latest（网页端自动读取这一份）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f band_samples_forward.enc ]; then
            echo "(没有前瞻快照，跳过发布 —— 库里还没攒下前瞻样本时属正常)"
            exit 0
          fi
          ls -la band_samples_forward.enc
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest \
              --title "样本语料（滚动更新）" \
              --notes "由 sample-harvest 工作流每日自动发布。文件为 BAND_KEY 加密产物，非明文；网页端读取此文件以展示「逻辑有效性验证」。"
          gh release upload data-latest band_samples_forward.enc --clobber
          echo "✅ 已发布到 data-latest"

      - name: 上传加密语料（供本机 --pull 拉回）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: band-samples-${{ steps.ckey.outputs.key }}
          path: band_samples.enc
          if-no-files-found: ignore
          retention-days: 30
